<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080a0f"/>
      <stop offset="0.55" stop-color="#101624"/>
      <stop offset="1" stop-color="#07151a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .panel{fill:#151b28;stroke:#2d3748;stroke-width:1.2}
      .muted{fill:#828b9d;font-family:Inter,Arial,sans-serif}
      .text{fill:#d6dbe7;font-family:Inter,Arial,sans-serif}
      .mono{fill:#8fb8ff;font-family:Consolas,monospace}
      .lane{fill:#1b2435;stroke:#334155;stroke-width:1}
      .node{fill:#182131;stroke:#3b4a63;stroke-width:1.5}
      .done{fill:#0b2b28;stroke:#2dd4bf;stroke-width:2}
      .active{fill:#102b55;stroke:#60a5fa;stroke-width:2.5}
      .fail{fill:#281f14;stroke:#fbbf24;stroke-width:1.5}
      .edge{stroke:#2dd4bf;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dimedge{stroke:#64748b;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <path d="M0 0H1440V900H0Z" fill="url(#bg)"/>
  <g opacity=".12">
    <path d="M0 120H1440M0 240H1440M0 360H1440M0 480H1440M0 600H1440M0 720H1440" stroke="#ffffff"/>
    <path d="M120 0V900M240 0V900M360 0V900M480 0V900M600 0V900M720 0V900M840 0V900M960 0V900M1080 0V900M1200 0V900M1320 0V900" stroke="#ffffff"/>
  </g>

  <rect x="28" y="24" width="1384" height="64" rx="8" fill="#090c12" stroke="#263244"/>
  <rect x="52" y="41" width="34" height="34" rx="8" fill="url(#accent)"/>
  <text x="69" y="63" text-anchor="middle" fill="#fff" font-family="Consolas,monospace" font-size="13" font-weight="700">TS</text>
  <text x="104" y="62" class="text" font-size="20" font-weight="800">Enterprise Text2SQL</text>
  <text x="330" y="62" class="muted" font-size="12">v2.0 · LangGraph · Review + Repair</text>
  <circle cx="1300" cy="56" r="6" fill="#2dd4bf"/>
  <text x="1316" y="61" class="muted" font-size="13">ONLINE</text>

  <rect x="28" y="112" width="250" height="740" rx="10" class="panel" filter="url(#shadow)"/>
  <text x="52" y="150" class="muted" font-size="13" font-weight="800">DATABASE SCHEMA</text>
  <g class="mono" font-size="14">
    <text x="52" y="194">▸ customers 500R 9C</text>
    <text x="52" y="230">▸ orders 2000R 10C</text>
    <text x="52" y="266">▸ order_items 6000R 7C</text>
    <text x="52" y="302">▸ products 1200R 12C</text>
    <text x="52" y="338">▸ categories 18R 4C</text>
  </g>

  <rect x="302" y="112" width="352" height="740" rx="10" class="panel" filter="url(#shadow)"/>
  <text x="326" y="150" class="muted" font-size="13" font-weight="800">QUERY</text>
  <rect x="326" y="184" width="250" height="72" rx="12" fill="#101827" stroke="#29364a"/>
  <text x="346" y="216" class="text" font-size="16">你好，我是智能数据分析助手。</text>
  <text x="346" y="240" class="muted" font-size="14">用自然语言提问，我会生成 SQL。</text>
  <rect x="382" y="298" width="248" height="52" rx="12" fill="url(#accent)"/>
  <text x="506" y="330" text-anchor="middle" fill="#fff" font-size="16" font-family="Inter,Arial,sans-serif" font-weight="700">销售额最高的前 10 个商品</text>
  <rect x="326" y="716" width="232" height="42" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="344" y="742" class="muted" font-size="14">输入你的问题...</text>
  <rect x="568" y="716" width="62" height="42" rx="8" fill="url(#accent)"/>
  <text x="599" y="742" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">发送</text>

  <rect x="678" y="112" width="734" height="740" rx="10" class="panel" filter="url(#shadow)"/>
  <text x="704" y="150" class="muted" font-size="13" font-weight="800">FLOW TRACE</text>

  <rect x="704" y="184" width="682" height="106" rx="18" class="lane"/>
  <rect x="704" y="318" width="682" height="106" rx="18" class="lane"/>
  <rect x="704" y="452" width="682" height="106" rx="18" class="lane"/>
  <rect x="704" y="586" width="682" height="106" rx="18" class="lane"/>
  <text x="724" y="208" class="muted" font-size="11" font-weight="800">BRANCH</text>
  <text x="724" y="342" class="muted" font-size="11" font-weight="800">MAIN PIPELINE</text>
  <text x="724" y="476" class="muted" font-size="11" font-weight="800">RUN & ANSWER</text>
  <text x="724" y="610" class="muted" font-size="11" font-weight="800">REPAIR / FAILURE</text>

  <path class="edge" d="M740 371H815M923 371H998M1106 371H1181M1289 371V505H1214M1106 505H1031"/>
  <path class="dimedge" d="M869 339V237H998M1106 237H1181"/>
  <path class="dimedge" d="M1085 537V639"/>

  <g font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" text-anchor="middle">
    <rect x="760" y="339" width="108" height="64" rx="10" class="done"/><text x="814" y="376" class="text">意图识别</text>
    <rect x="943" y="339" width="108" height="64" rx="10" class="done"/><text x="997" y="376" class="text">复杂度分类</text>
    <rect x="1126" y="339" width="108" height="64" rx="10" class="done"/><text x="1180" y="376" class="text">Schema 检索</text>
    <rect x="1260" y="339" width="108" height="64" rx="10" class="active"/><text x="1314" y="376" class="text">SQL 审查</text>
    <rect x="1126" y="473" width="108" height="64" rx="10" class="node"/><text x="1180" y="510" class="text">SQL 校验</text>
    <rect x="943" y="473" width="108" height="64" rx="10" class="node"/><text x="997" y="510" class="text">执行查询</text>
    <rect x="760" y="473" width="108" height="64" rx="10" class="node"/><text x="814" y="510" class="text">汇总回答</text>
    <rect x="943" y="607" width="108" height="64" rx="10" class="fail"/><text x="997" y="644" class="text">ReAct 修复</text>
  </g>

  <rect x="704" y="724" width="682" height="92" rx="10" fill="#0f172a" stroke="#334155"/>
  <text x="724" y="754" class="muted" font-size="13" font-weight="800">SQL PREVIEW</text>
  <text x="724" y="785" class="mono" font-size="15">SELECT p.name, SUM(oi.quantity * oi.unit_price) AS revenue</text>
  <text x="724" y="810" class="mono" font-size="15">FROM products p JOIN order_items oi ON p.id = oi.product_id ...</text>
</svg>
