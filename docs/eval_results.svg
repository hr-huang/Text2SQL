<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <style>
    .title { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .axis { stroke: #475569; stroke-width: 1; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .tick { fill: #94a3b8; font-size: 11px; }
    .legend-text { fill: #cbd5e1; font-size: 11px; }
    .value { fill: #ffffff; font-size: 14px; font-weight: 700; text-anchor: middle; }
    .group-label { fill: #cbd5e1; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .note { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="760" height="480" rx="12" fill="url(#bgGrad)"/>

  <text x="30" y="40" class="title">Evaluation Results</text>
  <text x="30" y="60" class="subtitle">68-question gold eval set · DeepSeek-V4-Flash</text>

  <!-- Y axis grid (0-100%) - chart area y=120 to y=400, range 280px -->
  <line x1="80" y1="400" x2="740" y2="400" class="axis"/>
  <line x1="80" y1="330" x2="740" y2="330" class="grid"/>
  <line x1="80" y1="260" x2="740" y2="260" class="grid"/>
  <line x1="80" y1="190" x2="740" y2="190" class="grid"/>
  <line x1="80" y1="120" x2="740" y2="120" class="grid"/>
  <text x="72" y="404" class="tick" text-anchor="end">0%</text>
  <text x="72" y="334" class="tick" text-anchor="end">25%</text>
  <text x="72" y="264" class="tick" text-anchor="end">50%</text>
  <text x="72" y="194" class="tick" text-anchor="end">75%</text>
  <text x="72" y="124" class="tick" text-anchor="end">100%</text>

  <!-- Simple 100%: h=280, y=120 -->
  <rect x="150" y="120" width="90" height="280" rx="4" fill="url(#bar1)"/>
  <text x="195" y="140" class="value">100%</text>

  <!-- Medium 89.7%: h=251.2, y=148.8 -->
  <rect x="330" y="149" width="90" height="251" rx="4" fill="url(#bar2)"/>
  <text x="375" y="169" class="value">89.7%</text>

  <!-- Complex 75% (sub-task success rate): h=210, y=190 -->
  <rect x="510" y="190" width="90" height="210" rx="4" fill="url(#bar3)"/>
  <text x="555" y="210" class="value">75%</text>

  <!-- X-axis labels -->
  <text x="195" y="425" class="group-label">Simple</text>
  <text x="195" y="445" class="note">29 / 29</text>
  <text x="375" y="425" class="group-label">Medium</text>
  <text x="375" y="445" class="note">26 / 29</text>
  <text x="555" y="425" class="group-label">Complex</text>
  <text x="555" y="445" class="note">子任务执行成功率</text>

  <!-- Legend -->
  <g transform="translate(160, 462)">
    <rect x="0" y="0" width="12" height="12" rx="2" fill="url(#bar1)"/>
    <text x="18" y="10" class="legend-text">Simple / Medium: SQL 执行结果等价校验</text>
    <rect x="350" y="0" width="12" height="12" rx="2" fill="url(#bar3)"/>
    <text x="368" y="10" class="legend-text">Complex: LLM-as-judge 语义等价</text>
  </g>
</svg>
