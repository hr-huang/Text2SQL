<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="SQL result table">
  <defs>
    <style>.bg{fill:#090d16}.panel{fill:#111827;stroke:#26364e;stroke-width:2}.head{fill:#0f172a}.row{fill:#0b1220}.alt{fill:#101827}.muted{fill:#8d98aa;font-family:Inter,Arial,sans-serif}.txt{fill:#d6dbe7;font-family:Inter,Arial,sans-serif}.mono{fill:#93c5fd;font-family:Consolas,Menlo,monospace}.num{fill:#22d3ee;font-family:Consolas,Menlo,monospace}</style>
  </defs>
  <rect width="900" height="520" rx="18" class="bg"/>
  <rect x="28" y="28" width="844" height="464" rx="18" class="panel"/>
  <text x="58" y="72" class="muted" font-size="18" font-weight="800">SQL RESULT</text>
  <text x="58" y="106" class="txt" font-size="18">图表下方保留原始查询结果，方便核对 SQL 输出。</text>
  <g transform="translate(58 145)">
    <rect x="0" y="0" width="784" height="46" rx="8" class="head"/>
    <text x="28" y="30" class="muted" font-size="15" font-weight="800">month</text>
    <text x="258" y="30" class="muted" font-size="15" font-weight="800">order_count</text>
    <text x="520" y="30" class="muted" font-size="15" font-weight="800">generated_sql</text>
    <rect x="0" y="58" width="784" height="44" rx="8" class="row"/>
    <text x="28" y="86" class="mono" font-size="15">2026-01</text><text x="300" y="86" class="num" font-size="15">186</text><text x="520" y="86" class="mono" font-size="13">SELECT ... GROUP BY month</text>
    <rect x="0" y="112" width="784" height="44" rx="8" class="alt"/>
    <text x="28" y="140" class="mono" font-size="15">2026-02</text><text x="300" y="140" class="num" font-size="15">204</text><text x="520" y="140" class="mono" font-size="13">readonly validated</text>
    <rect x="0" y="166" width="784" height="44" rx="8" class="row"/>
    <text x="28" y="194" class="mono" font-size="15">2026-03</text><text x="300" y="194" class="num" font-size="15">231</text><text x="520" y="194" class="mono" font-size="13">LIMIT applied</text>
    <rect x="0" y="220" width="784" height="44" rx="8" class="alt"/>
    <text x="28" y="248" class="mono" font-size="15">2026-04</text><text x="300" y="248" class="num" font-size="15">219</text><text x="520" y="248" class="mono" font-size="13">confidence 91%</text>
  </g>
</svg>
