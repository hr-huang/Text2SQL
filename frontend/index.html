<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enterprise Text2SQL</title>
<link rel="stylesheet" href="/static/style.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="brand-icon">TS</div>
      <span class="brand-name">Enterprise Text2SQL</span>
      <span class="brand-tag">v2.0</span>
    </div>
    <div class="topbar-right">
      <div class="status" id="statusBox"><div class="status-dot online" id="dot"></div><span id="statusLabel">ONLINE</span></div>
      <select class="ds-select" id="ds" onchange="onDS()">
        <option value="ecommerce_db">电商数据库</option>
        <option value="chinook_db">音乐商店</option>
      </select>
    </div>
  </div>
  <div class="main">
    <div class="schema">
      <div class="schema-hd">Database Schema</div>
      <div class="schema-list" id="schemaList"><div class="loading">Loading...</div></div>
    </div>
    <div class="chat">
      <div class="chat-hd"><div class="ring"></div> Query</div>
      <div class="chat-msgs" id="chatMsgs">
        <div class="msg ai">你好，我是智能数据分析助手。<br><span class="dim">用自然语言提问，我会生成 SQL、执行查询并解释结果。</span></div>
      </div>
      <div class="chat-foot">
        <div class="chips" id="chips"></div>
        <div class="input-row">
          <input id="qInput" type="text" placeholder="输入你的问题，按 Enter 发送..." onkeydown="if(event.key==='Enter')ask()">
          <button class="btn-send" id="sendBtn" onclick="ask()">发送</button>
        </div>
      </div>
    </div>
    <div class="results" id="resultsPanel">
      <div class="empty" id="emptyState"><div class="empty-icon">◇</div><span>输入问题后，这里会实时展示流程、SQL 和结果</span></div>
      <div class="card reveal" id="progressCard" style="display:none">
        <div class="card-hd"><div class="card-dot prog"></div> 流程追踪</div>
        <div class="card-bd"><svg viewBox="0 0 1040 700" id="graphSvg" preserveAspectRatio="xMidYMid meet" style="width:100%"></svg></div>
      </div>
      <div class="card reveal" id="sqlCard" style="display:none">
        <div class="card-hd"><div class="card-dot sql"></div> SQL</div>
        <div class="card-bd"><div class="sql-code" id="sqlBlock"></div></div>
      </div>
      <div class="card reveal" id="answerCard" style="display:none">
        <div class="card-hd"><div class="card-dot ai"></div> Response</div>
        <div class="card-bd"><div class="answer-txt" id="answerBlock"></div></div>
      </div>
      <div class="card reveal" id="chartCard" style="display:none">
        <div class="card-hd"><div class="card-dot chart"></div> Chart</div>
        <div class="card-bd"><div id="chartBox"></div></div>
      </div>
      <div class="card reveal" id="tableCard" style="display:none">
        <div class="card-hd"><div class="card-dot data"></div> Data <span id="rowCount"></span></div>
        <div class="card-bd"><table class="data-tbl" id="dataTable"></table></div>
      </div>
      <div class="conf-row reveal" id="confBar" style="display:none"><span>Confidence</span><div class="conf-track"><div class="conf-fill" id="confFill"></div></div><span id="confText"></span></div>
      <div class="card reveal" id="costCard" style="display:none">
        <div class="card-hd"><div class="card-dot cost"></div> Agent Cost & Latency</div>
        <div class="card-bd">
          <div class="cost-grid">
            <div><span class="cost-num" id="costTokens">0</span><span class="cost-lbl">Tokens</span></div>
            <div><span class="cost-num" id="costCalls">0</span><span class="cost-lbl">LLM Calls</span></div>
            <div><span class="cost-num" id="costWarn">0</span><span class="cost-lbl">Warnings</span></div>
          </div>
          <div class="risk-pill" id="riskPill" style="display:none"></div>
          <div class="warn-list" id="warnList"></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" style="display:none"></div>
<script src="/static/app.js"></script>
</body>
</html>
