<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070a12"/>
      <stop offset="0.55" stop-color="#101827"/>
      <stop offset="1" stop-color="#06151a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2b28"/>
      <stop offset="1" stop-color="#123f3a"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
    <style>
      .panel{fill:#121a29;stroke:#2b3a52;stroke-width:2}
      .panel2{fill:#0f1726;stroke:#26364d;stroke-width:2}
      .title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-weight:800}
      .text{fill:#d6dbe7;font-family:Inter,Arial,sans-serif}
      .muted{fill:#8d98aa;font-family:Inter,Arial,sans-serif}
      .mono{fill:#9cc4ff;font-family:Consolas,Menlo,monospace}
      .node{fill:#182234;stroke:#3b4c67;stroke-width:2}
      .done{fill:url(#ok);stroke:#2dd4bf;stroke-width:3}
      .active{fill:#102b55;stroke:#60a5fa;stroke-width:4}
      .warn{fill:#2b2114;stroke:#fbbf24;stroke-width:2}
      .edge{stroke:#2dd4bf;stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .edge2{stroke:#64748b;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:.65}
      .chip{fill:#172033;stroke:#334155;stroke-width:2}
      .lane{fill:#182236;stroke:#32435f;stroke-width:2}
    </style>
  </defs>

  <rect width="2400" height="1350" fill="url(#page)"/>
  <g opacity=".10">
    <path d="M0 150H2400M0 300H2400M0 450H2400M0 600H2400M0 750H2400M0 900H2400M0 1050H2400M0 1200H2400" stroke="#fff"/>
    <path d="M150 0V1350M300 0V1350M450 0V1350M600 0V1350M750 0V1350M900 0V1350M1050 0V1350M1200 0V1350M1350 0V1350M1500 0V1350M1650 0V1350M1800 0V1350M1950 0V1350M2100 0V1350M2250 0V1350" stroke="#fff"/>
  </g>

  <rect x="48" y="36" width="2304" height="92" rx="16" fill="#090d16" stroke="#26364e"/>
  <rect x="82" y="58" width="52" height="52" rx="13" fill="url(#brand)"/>
  <text x="108" y="92" text-anchor="middle" fill="#fff" font-family="Consolas,Menlo,monospace" font-size="21" font-weight="800">TS</text>
  <text x="160" y="89" class="title" font-size="34">Enterprise Text2SQL</text>
  <text x="540" y="89" class="muted" font-size="22">LangGraph · Schema RAG · Review Agent · Repair Agent · SSE Trace</text>
  <circle cx="2190" cy="82" r="10" fill="#2dd4bf"/>
  <text x="2215" y="90" class="muted" font-size="22">ONLINE</text>

  <rect x="48" y="164" width="360" height="1138" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="88" y="224" class="muted" font-size="20" font-weight="800">DATABASE SCHEMA</text>
  <g font-size="22">
    <rect x="82" y="270" width="292" height="58" rx="12" class="chip"/>
    <text x="108" y="307" class="mono">▸ customers</text><text x="296" y="307" class="muted">500R 9C</text>
    <rect x="82" y="350" width="292" height="58" rx="12" class="chip"/>
    <text x="108" y="387" class="mono">▸ orders</text><text x="296" y="387" class="muted">2000R 10C</text>
    <rect x="82" y="430" width="292" height="58" rx="12" class="chip"/>
    <text x="108" y="467" class="mono">▸ order_items</text><text x="296" y="467" class="muted">6000R 7C</text>
    <rect x="82" y="510" width="292" height="58" rx="12" class="chip"/>
    <text x="108" y="547" class="mono">▸ products</text><text x="296" y="547" class="muted">1200R 12C</text>
    <rect x="82" y="590" width="292" height="58" rx="12" class="chip"/>
    <text x="108" y="627" class="mono">▸ categories</text><text x="296" y="627" class="muted">18R 4C</text>
  </g>
  <rect x="82" y="720" width="292" height="258" rx="14" class="panel2"/>
  <text x="108" y="764" class="muted" font-size="19" font-weight="800">RAG CANDIDATES</text>
  <text x="108" y="812" class="text" font-size="21">Top tables: 15</text>
  <text x="108" y="852" class="text" font-size="21">Top columns: 60</text>
  <text x="108" y="892" class="text" font-size="21">Relationships filtered</text>
  <text x="108" y="932" class="text" font-size="21">Hash cache enabled</text>

  <rect x="440" y="164" width="500" height="1138" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="480" y="224" class="muted" font-size="20" font-weight="800">QUERY</text>
  <rect x="480" y="270" width="370" height="122" rx="18" class="panel2"/>
  <text x="510" y="322" class="text" font-size="23">你好，我是智能数据分析助手。</text>
  <text x="510" y="360" class="muted" font-size="20">用自然语言提问，我会生成 SQL。</text>
  <rect x="525" y="448" width="365" height="82" rx="20" fill="url(#brand)"/>
  <text x="708" y="501" text-anchor="middle" fill="#fff" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="800">销售额最高的前 10 个商品</text>
  <text x="480" y="610" class="muted" font-size="19" font-weight="800">EXAMPLE QUESTIONS</text>
  <rect x="480" y="648" width="410" height="58" rx="14" class="chip"/><text x="508" y="685" class="text" font-size="21">各品类商品数量占比</text>
  <rect x="480" y="728" width="410" height="58" rx="14" class="chip"/><text x="508" y="765" class="text" font-size="21">按月份统计下单数量趋势</text>
  <rect x="480" y="808" width="410" height="58" rx="14" class="chip"/><text x="508" y="845" class="text" font-size="21">销售额最高的前 10 个商品</text>
  <rect x="480" y="1162" width="310" height="66" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <text x="510" y="1203" class="muted" font-size="21">输入你的问题...</text>
  <rect x="808" y="1162" width="82" height="66" rx="14" fill="url(#brand)"/>
  <text x="849" y="1203" text-anchor="middle" fill="#fff" font-size="21" font-family="Inter,Arial,sans-serif" font-weight="800">发送</text>

  <rect x="972" y="164" width="1380" height="1138" rx="18" class="panel" filter="url(#shadow)"/>
  <text x="1018" y="224" class="muted" font-size="20" font-weight="800">LANGGRAPH FLOW TRACE</text>
  <text x="1770" y="224" class="muted" font-size="20">Every node is streamed by SSE</text>

  <rect x="1018" y="268" width="1288" height="154" rx="24" class="lane"/>
  <rect x="1018" y="464" width="1288" height="154" rx="24" class="lane"/>
  <rect x="1018" y="660" width="1288" height="154" rx="24" class="lane"/>
  <rect x="1018" y="856" width="1288" height="154" rx="24" class="lane"/>
  <text x="1050" y="306" class="muted" font-size="18" font-weight="800">BRANCH</text>
  <text x="1050" y="502" class="muted" font-size="18" font-weight="800">MAIN PIPELINE</text>
  <text x="1050" y="698" class="muted" font-size="18" font-weight="800">RUN & ANSWER</text>
  <text x="1050" y="894" class="muted" font-size="18" font-weight="800">REPAIR / FAILURE</text>

  <path class="edge" d="M1130 542H1265M1435 542H1570M1740 542H1875M2045 542V738H1908M1738 738H1603M1433 738H1298"/>
  <path class="edge2" d="M1348 504V345H1570M1740 345H1875"/>
  <path class="edge2" d="M1690 776V935"/>
  <path class="edge2" d="M1830 776V935H2050"/>
  <path class="edge2" d="M1740 935V800H1830"/>

  <g font-family="Inter,Arial,sans-serif" font-size="24" font-weight="800" text-anchor="middle">
    <rect x="1060" y="494" width="170" height="96" rx="18" class="done"/><text x="1145" y="552" class="text">意图识别</text>
    <rect x="1265" y="494" width="170" height="96" rx="18" class="done"/><text x="1350" y="552" class="text">复杂度分类</text>
    <rect x="1470" y="494" width="170" height="96" rx="18" class="done"/><text x="1555" y="552" class="text">语义解析</text>
    <rect x="1675" y="494" width="170" height="96" rx="18" class="done"/><text x="1760" y="552" class="text">Schema 检索</text>
    <rect x="1880" y="494" width="170" height="96" rx="18" class="done"/><text x="1965" y="552" class="text">生成 SQL</text>
    <rect x="2090" y="494" width="170" height="96" rx="18" class="active"/><text x="2175" y="552" class="text">SQL 审查</text>

    <rect x="1880" y="690" width="170" height="96" rx="18" class="node"/><text x="1965" y="748" class="text">SQL 校验</text>
    <rect x="1675" y="690" width="170" height="96" rx="18" class="node"/><text x="1760" y="748" class="text">执行查询</text>
    <rect x="1470" y="690" width="170" height="96" rx="18" class="node"/><text x="1555" y="748" class="text">汇总回答</text>
    <rect x="1265" y="690" width="170" height="96" rx="18" class="node"/><text x="1350" y="748" class="text">Response</text>

    <rect x="1470" y="886" width="170" height="96" rx="18" class="warn"/><text x="1555" y="944" class="text">校验失败</text>
    <rect x="1675" y="886" width="170" height="96" rx="18" class="warn"/><text x="1760" y="944" class="text">ReAct 修复</text>
    <rect x="2090" y="886" width="170" height="96" rx="18" class="warn"/><text x="2175" y="944" class="text">执行失败</text>
  </g>

  <rect x="1018" y="1060" width="1288" height="196" rx="18" class="panel2"/>
  <text x="1056" y="1110" class="muted" font-size="20" font-weight="800">SQL PREVIEW</text>
  <text x="1056" y="1166" class="mono" font-size="24">SELECT p.name, SUM(oi.quantity * oi.unit_price) AS revenue</text>
  <text x="1056" y="1210" class="mono" font-size="24">FROM products p JOIN order_items oi ON p.id = oi.product_id</text>
  <text x="1056" y="1254" class="mono" font-size="24">GROUP BY p.id ORDER BY revenue DESC LIMIT 10;</text>
</svg>
