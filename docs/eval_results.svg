<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <style>
    .title { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .axis { stroke: #475569; stroke-width: 1; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .tick { fill: #64748b; font-size: 11px; }
    .legend-text { fill: #cbd5e1; font-size: 11px; }
    .value { fill: #f1f5f9; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .delta { fill: #4ade80; font-size: 10px; font-weight: 600; text-anchor: middle; }
    .group-label { fill: #cbd5e1; font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
    .sub-bar { stroke: rgba(255,255,255,0.4); stroke-width: 1; }
  </style>

  <rect x="0" y="0" width="720" height="420" rx="12" fill="url(#bgGrad)"/>

  <text x="30" y="40" class="title">Accuracy Across Iterations</text>
  <text x="30" y="60" class="subtitle">60-question gold eval set · DeepSeek-V4-Flash · 加权综合从 85.7% → 91.7%</text>

  <!-- Y axis grid (0-100%) -->
  <line x1="100" y1="340" x2="690" y2="340" class="axis"/>
  <line x1="100" y1="285" x2="690" y2="285" class="grid"/>
  <line x1="100" y1="230" x2="690" y2="230" class="grid"/>
  <line x1="100" y1="175" x2="690" y2="175" class="grid"/>
  <line x1="100" y1="120" x2="690" y2="120" class="grid"/>
  <text x="92" y="344" class="tick" text-anchor="end">0%</text>
  <text x="92" y="289" class="tick" text-anchor="end">25%</text>
  <text x="92" y="234" class="tick" text-anchor="end">50%</text>
  <text x="92" y="179" class="tick" text-anchor="end">75%</text>
  <text x="92" y="124" class="tick" text-anchor="end">100%</text>

  <!-- Group 1: v1 baseline (positions: 130, 195, 260) -->
  <text x="195" y="110" class="group-label">v1 baseline</text>
  <rect x="130" y="127" width="40" height="213" rx="4" fill="url(#bar1)"/>
  <text x="150" y="120" class="value">97%</text>
  <text x="150" y="358" class="tick" text-anchor="middle">Simple</text>

  <rect x="195" y="177" width="40" height="163" rx="4" fill="url(#bar1)"/>
  <text x="215" y="170" class="value">74%</text>
  <text x="215" y="358" class="tick" text-anchor="middle">Medium</text>

  <rect x="260" y="340" width="40" height="0" rx="4" fill="url(#bar1)"/>
  <text x="280" y="333" class="tick" text-anchor="middle">—</text>
  <text x="280" y="358" class="tick" text-anchor="middle">Complex</text>

  <!-- Group 2: v2 RAG + Self-Reflection (positions: 360, 425, 490) -->
  <text x="425" y="110" class="group-label">v2 + RAG + reflect</text>
  <rect x="360" y="120" width="40" height="220" rx="4" fill="url(#bar2)"/>
  <text x="380" y="113" class="value">100%</text>
  <text x="380" y="358" class="tick" text-anchor="middle">Simple</text>
  <text x="380" y="140" class="delta">+3</text>

  <rect x="425" y="160" width="40" height="180" rx="4" fill="url(#bar2)"/>
  <text x="445" y="153" class="value">82%</text>
  <text x="445" y="358" class="tick" text-anchor="middle">Medium</text>
  <text x="445" y="180" class="delta">+8</text>

  <rect x="490" y="230" width="40" height="110" rx="4" fill="url(#bar2)"/>
  <text x="510" y="223" class="value">50%</text>
  <text x="510" y="358" class="tick" text-anchor="middle">Complex</text>

  <!-- Group 3: v3 + few-shot (positions: 590, 655, 720) - last is partly off canvas, that's fine -->
  <text x="655" y="110" class="group-label">v3 + few-shot</text>
  <rect x="590" y="120" width="40" height="220" rx="4" fill="url(#bar3)"/>
  <text x="610" y="113" class="value">100%</text>
  <text x="610" y="358" class="tick" text-anchor="middle">Simple</text>

  <rect x="655" y="129" width="40" height="211" rx="4" fill="url(#bar3)"/>
  <text x="675" y="122" class="value">96%</text>
  <text x="675" y="358" class="tick" text-anchor="middle">Medium</text>
  <text x="675" y="149" class="delta">+14</text>

  <rect x="720" y="230" width="40" height="110" rx="4" fill="url(#bar3)"/>
  <text x="740" y="223" class="value">50%</text>
  <text x="740" y="358" class="tick" text-anchor="middle">Complex</text>

  <!-- Legend -->
  <g transform="translate(30, 380)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#bar1)"/>
    <text x="20" y="11" class="legend-text">v1 baseline (pure vector RAG)</text>
    <rect x="220" y="0" width="14" height="14" rx="3" fill="url(#bar2)"/>
    <text x="240" y="11" class="legend-text">v2: + hybrid RAG + self-reflection</text>
    <rect x="450" y="0" width="14" height="14" rx="3" fill="url(#bar3)"/>
    <text x="470" y="11" class="legend-text">v3: + targeted few-shot prompts</text>
  </g>
</svg>