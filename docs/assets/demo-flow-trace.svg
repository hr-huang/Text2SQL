<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="LangGraph workflow trace">
  <defs>
    <style>
      .bg{fill:#090d16}.panel{fill:#111827;stroke:#26364e;stroke-width:2}.node{fill:#0b2b28;stroke:#2dd4bf;stroke-width:2}.active{fill:#102b55;stroke:#60a5fa;stroke-width:3}.skip{fill:#101827;stroke:#334155;stroke-width:2;opacity:.55}.txt{fill:#d6dbe7;font-family:Inter,Arial,sans-serif;font-weight:700}.muted{fill:#8d98aa;font-family:Inter,Arial,sans-serif}.edge{stroke:#2dd4bf;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="520" rx="18" class="bg"/>
  <rect x="28" y="28" width="844" height="464" rx="18" class="panel"/>
  <text x="58" y="72" class="muted" font-size="18" font-weight="800">WORKFLOW TRACE</text>
  <g transform="translate(70 110)">
    <rect x="0" y="120" width="110" height="56" rx="10" class="node"/><text x="55" y="153" text-anchor="middle" class="txt" font-size="15">intent</text>
    <rect x="142" y="120" width="110" height="56" rx="10" class="node"/><text x="197" y="153" text-anchor="middle" class="txt" font-size="15">classify</text>
    <rect x="284" y="120" width="110" height="56" rx="10" class="node"/><text x="339" y="153" text-anchor="middle" class="txt" font-size="15">semantic</text>
    <rect x="426" y="120" width="110" height="56" rx="10" class="node"/><text x="481" y="153" text-anchor="middle" class="txt" font-size="15">schema</text>
    <rect x="568" y="120" width="110" height="56" rx="10" class="active"/><text x="623" y="153" text-anchor="middle" class="txt" font-size="15">execute</text>
    <rect x="710" y="120" width="110" height="56" rx="10" class="skip"/><text x="765" y="153" text-anchor="middle" class="txt" font-size="15">answer</text>
    <path d="M110 148H142M252 148H284M394 148H426M536 148H568M678 148H710" class="edge"/>
    <rect x="284" y="20" width="110" height="56" rx="10" class="skip"/><text x="339" y="53" text-anchor="middle" class="txt" font-size="15">decompose</text>
    <rect x="426" y="20" width="110" height="56" rx="10" class="skip"/><text x="481" y="53" text-anchor="middle" class="txt" font-size="15">orchestrator</text>
    <path d="M197 120V48H284" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="5 6"/>
    <rect x="568" y="246" width="110" height="56" rx="10" class="skip"/><text x="623" y="279" text-anchor="middle" class="txt" font-size="15">repair</text>
    <path d="M623 176V246" stroke="#334155" stroke-width="3" fill="none" stroke-dasharray="5 6"/>
  </g>
  <text x="58" y="454" class="muted" font-size="16">SSE events light up nodes as LangGraph runs.</text>
</svg>
