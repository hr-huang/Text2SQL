<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Enterprise Text2SQL demo interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d16"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <style>
      .panel{fill:#111827;stroke:#26364e;stroke-width:2}
      .card{fill:#0f172a;stroke:#27364d;stroke-width:2}
      .title{fill:#f8fafc;font-family:Inter,Arial,sans-serif;font-weight:800}
      .text{fill:#d6dbe7;font-family:Inter,Arial,sans-serif}
      .muted{fill:#8d98aa;font-family:Inter,Arial,sans-serif}
      .mono{fill:#93c5fd;font-family:Consolas,Menlo,monospace}
      .ok{fill:#2dd4bf}
      .blue{fill:#60a5fa}
      .amber{fill:#fbbf24}
      .line{stroke:#2dd4bf;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1600" height="900" rx="0" fill="url(#bg)"/>
  <rect x="36" y="30" width="1528" height="72" rx="14" fill="#080c14" stroke="#26364e"/>
  <rect x="64" y="50" width="36" height="36" rx="8" fill="url(#brand)"/>
  <text x="82" y="74" text-anchor="middle" class="title" font-size="14">TS</text>
  <text x="118" y="75" class="title" font-size="28">Enterprise Text2SQL</text>
  <text x="455" y="75" class="muted" font-size="18">Schema RAG · Review Agent · Repair Agent · SSE Trace · ECharts</text>
  <circle cx="1458" cy="66" r="7" class="ok"/>
  <text x="1474" y="73" class="muted" font-size="16">ONLINE</text>

  <rect x="36" y="128" width="290" height="728" rx="16" class="panel"/>
  <text x="64" y="175" class="muted" font-size="16" font-weight="800">DATABASE SCHEMA</text>
  <g font-size="16">
    <rect x="62" y="210" width="238" height="44" rx="10" class="card"/>
    <text x="82" y="238" class="mono">customers</text><text x="226" y="238" class="muted">500R</text>
    <rect x="62" y="270" width="238" height="44" rx="10" class="card"/>
    <text x="82" y="298" class="mono">orders</text><text x="226" y="298" class="muted">2000R</text>
    <rect x="62" y="330" width="238" height="44" rx="10" class="card"/>
    <text x="82" y="358" class="mono">order_details</text><text x="226" y="358" class="muted">6000R</text>
    <rect x="62" y="390" width="238" height="44" rx="10" class="card"/>
    <text x="82" y="418" class="mono">products</text><text x="226" y="418" class="muted">200R</text>
    <rect x="62" y="450" width="238" height="44" rx="10" class="card"/>
    <text x="82" y="478" class="mono">regions</text><text x="226" y="478" class="muted">7R</text>
  </g>

  <rect x="354" y="128" width="410" height="728" rx="16" class="panel"/>
  <text x="384" y="175" class="muted" font-size="16" font-weight="800">QUERY</text>
  <rect x="384" y="214" width="326" height="72" rx="16" fill="#1d4ed8"/>
  <text x="406" y="245" class="text" font-size="18">按月份统计下单数量趋势</text>
  <text x="406" y="270" fill="#bfdbfe" font-family="Inter,Arial,sans-serif" font-size="14">user question</text>
  <text x="384" y="340" class="text" font-size="18">系统已生成 SQL、执行查询，</text>
  <text x="384" y="370" class="text" font-size="18">并自动渲染折线图和结果表。</text>
  <rect x="384" y="690" width="326" height="54" rx="12" fill="#0b1220" stroke="#334155"/>
  <text x="406" y="724" class="muted" font-size="16">输入问题，按 Enter 发送...</text>

  <rect x="792" y="128" width="772" height="728" rx="16" class="panel"/>
  <text x="824" y="175" class="muted" font-size="16" font-weight="800">REAL-TIME RESULTS</text>
  <rect x="824" y="204" width="708" height="168" rx="14" class="card"/>
  <text x="850" y="238" class="muted" font-size="14" font-weight="800">FLOW TRACE</text>
  <g transform="translate(850 268)">
    <rect x="0" y="0" width="96" height="40" rx="8" fill="#0b2b28" stroke="#2dd4bf"/>
    <rect x="126" y="0" width="96" height="40" rx="8" fill="#0b2b28" stroke="#2dd4bf"/>
    <rect x="252" y="0" width="96" height="40" rx="8" fill="#0b2b28" stroke="#2dd4bf"/>
    <rect x="378" y="0" width="96" height="40" rx="8" fill="#102b55" stroke="#60a5fa"/>
    <rect x="504" y="0" width="96" height="40" rx="8" fill="#151b28" stroke="#303a4e"/>
    <path d="M96 20H126M222 20H252M348 20H378M474 20H504" class="line"/>
    <text x="48" y="25" text-anchor="middle" class="text" font-size="13">intent</text>
    <text x="174" y="25" text-anchor="middle" class="text" font-size="13">schema</text>
    <text x="300" y="25" text-anchor="middle" class="text" font-size="13">sql</text>
    <text x="426" y="25" text-anchor="middle" class="text" font-size="13">execute</text>
    <text x="552" y="25" text-anchor="middle" class="text" font-size="13">answer</text>
  </g>

  <rect x="824" y="396" width="348" height="210" rx="14" class="card"/>
  <text x="850" y="430" class="muted" font-size="14" font-weight="800">SQL</text>
  <text x="850" y="466" class="mono" font-size="15">SELECT strftime('%Y-%m', order_date)</text>
  <text x="850" y="494" class="mono" font-size="15">AS month, COUNT(*) AS order_count</text>
  <text x="850" y="522" class="mono" font-size="15">FROM orders</text>
  <text x="850" y="550" class="mono" font-size="15">GROUP BY month ORDER BY month</text>
  <text x="850" y="578" class="mono" font-size="15">LIMIT 500;</text>

  <rect x="1194" y="396" width="338" height="210" rx="14" class="card"/>
  <text x="1220" y="430" class="muted" font-size="14" font-weight="800">CHART</text>
  <path d="M1230 558 L1280 526 L1330 540 L1380 484 L1430 498 L1480 452" class="line"/>
  <circle cx="1230" cy="558" r="5" class="blue"/><circle cx="1280" cy="526" r="5" class="blue"/>
  <circle cx="1330" cy="540" r="5" class="blue"/><circle cx="1380" cy="484" r="5" class="blue"/>
  <circle cx="1430" cy="498" r="5" class="blue"/><circle cx="1480" cy="452" r="5" class="blue"/>
  <path d="M1230 575H1490M1230 455V575" stroke="#334155" stroke-width="2"/>

  <rect x="824" y="630" width="708" height="176" rx="14" class="card"/>
  <text x="850" y="664" class="muted" font-size="14" font-weight="800">ANSWER + TABLE</text>
  <text x="850" y="702" class="text" font-size="17">订单数量按月波动，近几个月有明显上升趋势。</text>
  <rect x="850" y="730" width="650" height="44" rx="8" fill="#0b1220"/>
  <text x="872" y="758" class="mono" font-size="14">month</text>
  <text x="1080" y="758" class="mono" font-size="14">order_count</text>
  <text x="1290" y="758" class="mono" font-size="14">confidence 91%</text>
</svg>
