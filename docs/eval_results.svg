<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#94a3b8"/><stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="bar2" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
  </defs>

  <style>
    .title { fill: #f1f5f9; font-size: 18px; font-weight: 700; }
    .subtitle { fill: #94a3b8; font-size: 12px; }
    .axis { stroke: #475569; stroke-width: 1; }
    .grid { stroke: #1e293b; stroke-width: 1; stroke-dasharray: 3 3; }
    .tick { fill: #94a3b8; font-size: 11px; }
    .legend-text { fill: #cbd5e1; font-size: 11px; }
    .value { fill: #ffffff; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .value-light { fill: #f1f5f9; font-size: 13px; font-weight: 700; text-anchor: middle; }
    .delta { fill: #4ade80; font-size: 11px; font-weight: 700; text-anchor: middle; }
    .group-label { fill: #cbd5e1; font-size: 12px; font-weight: 700; text-anchor: middle; letter-spacing: 1px; }
    .x-label { fill: #94a3b8; font-size: 11px; text-anchor: middle; }
  </style>

  <rect x="0" y="0" width="760" height="480" rx="12" fill="url(#bgGrad)"/>

  <text x="30" y="40" class="title">Accuracy Across Iterations</text>
  <text x="30" y="60" class="subtitle">60-question gold eval set · DeepSeek-V4-Flash · weighted overall 85.7% → 91.7%</text>

  <!-- Group labels (positioned well above bars) -->
  <text x="175" y="95" class="group-label">v1 baseline</text>
  <text x="400" y="95" class="group-label">v2 + RAG + reflect</text>
  <text x="625" y="95" class="group-label">v3 + few-shot</text>

  <!-- Y axis grid (0-100%) - chart area y=120 to y=400, range 280px -->
  <line x1="80" y1="400" x2="740" y2="400" class="axis"/>
  <line x1="80" y1="330" x2="740" y2="330" class="grid"/>
  <line x1="80" y1="260" x2="740" y2="260" class="grid"/>
  <line x1="80" y1="190" x2="740" y2="190" class="grid"/>
  <line x1="80" y1="120" x2="740" y2="120" class="grid"/>
  <text x="72" y="404" class="tick" text-anchor="end">0%</text>
  <text x="72" y="334" class="tick" text-anchor="end">25%</text>
  <text x="72" y="264" class="tick" text-anchor="end">50%</text>
  <text x="72" y="194" class="tick" text-anchor="end">75%</text>
  <text x="72" y="124" class="tick" text-anchor="end">100%</text>

  <!--
    Bar height formula: 280 * (value/100)
    Bar y top:        400 - height = 400 - 280*(value/100)
    Group 1 (v1): bars centered at x=125, 175, 225 (simple/medium/complex)
    Group 2 (v2): bars centered at x=350, 400, 450
    Group 3 (v3): bars centered at x=575, 625, 675
    Bar width: 40
  -->

  <!-- Group 1: v1 baseline -->
  <!-- Simple 97%: h=271.6, y=128.4 -->
  <rect x="105" y="128" width="40" height="272" rx="4" fill="url(#bar1)"/>
  <text x="125" y="148" class="value-light">97%</text>
  <!-- Medium 74%: h=207.2, y=192.8 -->
  <rect x="155" y="193" width="40" height="207" rx="4" fill="url(#bar1)"/>
  <text x="175" y="213" class="value-light">74%</text>
  <!-- Complex — (no data) -->
  <rect x="205" y="395" width="40" height="5" rx="2" fill="#475569"/>
  <text x="225" y="385" class="tick" text-anchor="middle">—</text>

  <!-- Group 2: v2 RAG + Self-Reflection -->
  <!-- Simple 100%: h=280, y=120 -->
  <rect x="330" y="120" width="40" height="280" rx="4" fill="url(#bar2)"/>
  <text x="350" y="140" class="value">100%</text>
  <text x="350" y="112" class="delta">+3</text>
  <!-- Medium 82%: h=229.6, y=170.4 -->
  <rect x="380" y="170" width="40" height="230" rx="4" fill="url(#bar2)"/>
  <text x="400" y="190" class="value">82%</text>
  <text x="400" y="162" class="delta">+8</text>
  <!-- Complex 50%: h=140, y=260 -->
  <rect x="430" y="260" width="40" height="140" rx="4" fill="url(#bar2)"/>
  <text x="450" y="280" class="value">50%</text>

  <!-- Group 3: v3 + few-shot -->
  <!-- Simple 100%: h=280, y=120 -->
  <rect x="555" y="120" width="40" height="280" rx="4" fill="url(#bar3)"/>
  <text x="575" y="140" class="value">100%</text>
  <!-- Medium 96%: h=268.8, y=131.2 -->
  <rect x="605" y="131" width="40" height="269" rx="4" fill="url(#bar3)"/>
  <text x="625" y="151" class="value">96%</text>
  <text x="625" y="123" class="delta">+14</text>
  <!-- Complex 50%: h=140, y=260 -->
  <rect x="655" y="260" width="40" height="140" rx="4" fill="url(#bar3)"/>
  <text x="675" y="280" class="value">50%</text>

  <!-- X-axis labels: centered per group of 3 bars -->
  <text x="175" y="425" class="x-label">Simple · Medium · Complex</text>
  <text x="400" y="425" class="x-label">Simple · Medium · Complex</text>
  <text x="625" y="425" class="x-label">Simple · Medium · Complex</text>

  <!-- Legend -->
  <g transform="translate(30, 455)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#bar1)"/>
    <text x="20" y="11" class="legend-text">v1 baseline (pure vector RAG)</text>
    <rect x="220" y="0" width="14" height="14" rx="3" fill="url(#bar2)"/>
    <text x="240" y="11" class="legend-text">v2: + hybrid RAG + self-reflection</text>
    <rect x="460" y="0" width="14" height="14" rx="3" fill="url(#bar3)"/>
    <text x="480" y="11" class="legend-text">v3: + targeted few-shot prompts</text>
  </g>
</svg>